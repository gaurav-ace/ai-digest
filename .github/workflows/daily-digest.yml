name: Daily digest

on:
  # Primary trigger: an external scheduler (cron-job.org) calls the workflow_dispatch API at
  # 06:45 IST with inputs.scheduled=true; see README. GitHub's own cron below is best-effort
  # (observed ~5 h late at this hour) and only acts as a fallback; the `gate` job makes any
  # trigger after the first one of the day a no-op.
  schedule:
    - cron: "15 1 * * *" # 06:45 IST nominal (fallback)
    - cron: "40 2 * * *" # 08:10 IST nominal (fallback)
  workflow_dispatch:
    inputs:
      scheduled:
        description: "Treat as the daily scheduled run (skip if today's digest already exists)"
        type: boolean
        default: false
  push:
    branches: [main] # redeploy on manual edits (no generation)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  # Decides whether this run should do anything: scheduled runs skip if today's digest already exists.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # latest main, including a digest committed by an earlier run today
      - id: check
        run: |
          last=$(node -p 'try { require("./data/latest-digest.json").date } catch { "" }')
          today=$(date -u +%F)
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.scheduled }}" = "true" ]; } && [ "$last" = "$today" ]; then
            echo "Today's digest ($today) already done; skipping this trigger."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45 # a stuck step must never block the day (GitHub's default is 6 h)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install Claude Code
        if: github.event_name != 'push'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code; else echo "No Claude token: Gemini only"; fi

      - name: Scan sources and write deep-dives
        if: github.event_name != 'push'
        env:
          # Either or both. Providers are tried in the order set in config/digest.json.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # `claude setup-token` (Claude Pro/Max)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # aistudio.google.com/apikey
        run: npm run digest

      - name: Commit new posts
        if: github.event_name != 'push'
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add src/content/posts data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "digest: $(date -u +%F)"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Keep digest summary for the Discord step
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: latest-digest
          path: data/latest-digest.json
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    # Runs after deploy so the links in Discord already work.
    needs: deploy
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: latest-digest
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Post summary to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run notify
